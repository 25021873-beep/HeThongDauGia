# --- DATABASE CONFIG ---
db.url=
db.user=
db.password=

# --- DATABASE POOL CONFIG ---
db.pool.maximumPoolSize=20
db.pool.minimumIdle=5
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
# Set 0 to disable. Use 60000 temporarily when debugging leaked connections.
db.pool.leakDetectionThreshold=0

# --- SERVER CONFIG ---
server.port=8888
server.max_threads=100

# --- AUCTION RULES ---
auction.min_increment=10000

# --- ANTI-SNIPING ---
# If someone bids during the last 60 seconds.
auction.antisnipe.trigger_seconds=60
# Then extend the auction by 120 seconds.
auction.antisnipe.extend_seconds=120
