name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check project structure
        run: |
          pwd
          ls -la
          ls -la HeThongDauGia
          test -f HeThongDauGia/pom.xml

      - name: Run tests and package
        run: mvn -B -f HeThongDauGia/pom.xml clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: hethongdaugia-server-jar
          path: HeThongDauGia/target/*.jar